{% extends 'base.html' %}
{%block content%}
{% if current_user.is_authenticated %}
  <a class="btn btn-danger"  href="{{url_for('main.logout')}}">SignOut</a>
{% else%}
  <a class="btn btn-secondary"  href="{{url_for('main.token')}}">SignIn</a>
  <a class="btn btn-info"  href="{{url_for('main.register')}}">SigUp</a>
{% endif%}
{%endblock content%}
