{%extends 'base.html'%}
{%from  'bootstrap/utils.html' import render_icon as i%}
{%block content%}
<style>
    table {
        border :5px solid black;
    }
     
    table th {padding : 30px;
            background:#ccdfcc;
 }
    table td {padding : 10px;}
</style>
    <table class= "table table-striped table-bordered">
        <tr>
            <th>Name</th>
            <th>Specs</th>
            <th>Price</th>
            <th>Order</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td style="width: 3rem;">{{ product.specs }}</td>
            <td>{{ product.price }}</td>           
            <td><a class="btn btn-primary" href="{{url_for('payment.create_orders',id=product.id)}}">Order {{i('cart-plus')}}</a></td>
        </tr>    
        {% endfor %}    
    </table>
{%endblock content%}
